name: mind_bloom
description: A parent-child monitoring application for daily activities tracking.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Supabase
  supabase_flutter: ^2.0.0

  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  
  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.0.9
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.2.2
  crypto: ^3.0.3
  
  # Animations
  animations: ^2.0.11
  lottie: ^3.0.0
  
  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

